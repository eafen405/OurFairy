name: check

# The repository's only gate used to be a local pre-commit hook. In the 131–137
# wave it was bypassed with `--no-verify` 27 times, and three of six integration
# branches never left the machine, so nothing ran at all. This workflow runs the
# same full gate on the server, where a bypassed hook cannot reach.
#
# The gate runs on pushes to main and to the integration branches, and on demand.
# A pull request sync does not run it: the integration push that carries the
# change does, and running both meant the same suite twice per change.
on:
  push:
    branches:
      - main
      - 'integration/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # combo:verify compares HEAD with the integration branch, so the
          # history and the remote branch refs have to be present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare Linux runtime dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap poppler-utils util-linux
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc --die-with-parent -- true
          pdftoppm -v

      # The backend tests drive the real dsh launcher, so the companion checkout
      # has to exist at the commit combo.json locks, with the four builds that
      # combo.json names. OURFAIRY_DSH_DIR points the launcher and combo:verify
      # at this clone instead of combo.json's local path.
      - name: Check out the locked dsh combination
        run: |
          set -euo pipefail
          branch=$(node -p "require('./combo.json').repos.dsh.integrationBranch")
          locked=$(node -p "require('./combo.json').repos.dsh.productCommit")
          git clone --quiet --branch "$branch" --single-branch \
            "$(node -p "require('./combo.json').repos.dsh.remoteUrl")" "$RUNNER_TEMP/dsh"
          actual=$(git -C "$RUNNER_TEMP/dsh" rev-parse HEAD)
          if [ "$actual" != "$locked" ]; then
            echo "::error::dsh $branch is $actual but combo.json locks $locked; update combo.json when the combination intentionally moves"
            exit 1
          fi
          echo "OURFAIRY_DSH_DIR=$RUNNER_TEMP/dsh" >> "$GITHUB_ENV"

      - name: Build the locked dsh combination
        working-directory: ${{ runner.temp }}/dsh
        run: |
          set -euo pipefail
          corepack enable
          for step in \
            "corepack pnpm@11.28.5 install" \
            "corepack pnpm@11.28.5 run build:lib:host" \
            "corepack pnpm@11.28.5 run build:lib:client" \
            "corepack pnpm@11.28.5 run build:native-system"
          do
            echo "::group::$step"
            $step
            echo "::endgroup::"
          done

      # npm test builds once and keeps the build lock until the suite exits.
      - name: Full suite and combination
        run: |
          set -euo pipefail
          npm test
          npm run combo:verify

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create a synthetic Google Services configuration
        run: cp tests/fixtures/google-services.json android/app/google-services.json

      - name: Android unit tests and lint
        working-directory: android
        run: ./gradlew test lintDebug
